<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculadora de Resina - Tope de Mesa</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:24px;background:#f7f7f8;color:#111}
    .card{max-width:520px;margin:0 auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    label{display:block;margin-bottom:6px;font-weight:600}
    input[type=number]{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:16px}
    button{margin-top:12px;padding:10px 14px;border:0;background:#0066cc;color:#fff;border-radius:6px;font-weight:600;cursor:pointer}
    .result{margin-top:16px;padding:12px;background:#f0f8ff;border-radius:6px}
    .small{font-size:13px;color:#555}
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculadora de resina</h1>
    <p class="small">Introduce el tamaño del tope en pulgadas (diámetro). Escribe el valor en el campo vacío y pulsa calcular.</p>

    <label for="size">Tamaño (pulgadas)</label>
    <input id="size" type="text" inputmode="decimal" placeholder="Ej: 24" />

    <button id="calc">Calcular</button>

    <div id="out" class="result" aria-live="polite" hidden>
      <div id="sizein"></div>
      <div id="mitad"></div>
      <div id="dividido"></div>
      <div id="cuadrado"></div>
      <div id="porpi"></div>
      <div id="grams" style="margin-top:8px;font-weight:700"></div>
      <div class="small" style="margin-top:8px">Cálculo: pulgadas → cm (×2.54), dividir entre 2, elevar al cuadrado y multiplicar por 1,000 → gramos.</div>
    </div>
  </div>

  <script>
    const input = document.getElementById('size');
    const btn = document.getElementById('calc');
    const out = document.getElementById('out');
    const sizeInEl = document.getElementById('sizein');
    const mitadEl = document.getElementById('mitad');
    const divididoEl = document.getElementById('dividido');
    const cuadradoEl = document.getElementById('cuadrado');
    const porPiEl = document.getElementById('porpi');
    const gramsEl = document.getElementById('grams');

    function calcular(){
      const raw = input.value.trim();
      if (raw === ''){
        out.hidden = true;
        return;
      }
      const size = Number(raw.replace(',', '.'));
      if (!isFinite(size) || size <= 0){
        alert('Introduce un número válido en pulgadas mayor que 0.');
        out.hidden = true;
        return;
      }

      // Secuencia solicitada: dividir entre 2, dividir entre 100, elevar al cuadrado,
      // multiplicar por 3.1416 y luego por 1000
      const mitad = size / 2.0;
      const dividido = mitad / 100.0;
      const cuadrado = dividido * dividido;
      const porPi = cuadrado * 3.1416;
      const gramos = porPi * 1000.0;

      sizeInEl.textContent = `Tamaño ingresado: ${size.toFixed(2)} in`;
      mitadEl.textContent = `Mitad: ${mitad.toFixed(6)}`;
      divididoEl.textContent = `Mitad / 100: ${dividido.toFixed(6)}`;
      cuadradoEl.textContent = `(Mitad/100)²: ${cuadrado.toFixed(9)}`;
      porPiEl.textContent = `× 3.1416: ${porPi.toFixed(9)}`;
      gramsEl.textContent = `Resina necesaria: ${gramos.toFixed(6)} g`;
      out.hidden = false;
    }

    btn.addEventListener('click', calcular);
    input.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') calcular(); });
  </script>
</body>
</html>
